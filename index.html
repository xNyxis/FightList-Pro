<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101421"><title>FightList</title><style>
:root{color-scheme:dark;--bg:#0b0e17;--panel:#171c2a;--line:#29344a;--accent:#8170ff;--txt:#f6f7fb;--muted:#9aa6bd;--danger:#ff5b6e}*{box-sizing:border-box}body{margin:0;padding:18px 16px calc(32px + env(safe-area-inset-bottom));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at top,#1c2440,#090c14 60%);color:var(--txt)}main{max-width:720px;margin:auto}.hero{border:1px solid #3a4664;border-radius:22px;padding:20px;background:linear-gradient(125deg,#143c80,#32216e 55%,#721e46);margin-bottom:15px}.hero h1{font-size:27px;margin:0 0 8px}.hero p{color:#d4dcf4;margin:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:13px 0}.label{font-size:12px;color:var(--muted);margin-bottom:7px;display:block}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.btn{background:var(--accent);color:white;border:0;border-radius:12px;padding:12px 14px;font-weight:650;font-size:15px;cursor:pointer}.btn.secondary{background:#29344b}.btn.red{background:#3b202c;color:#ff8695}.btn.small{padding:8px 11px;font-size:13px;flex:none}.select,input{font:inherit;color:white;background:#0e1422;border:1px solid #33415b;border-radius:12px;padding:12px;width:100%}h2{font-size:18px;margin:6px 0 12px}.match{border:1px solid var(--line);background:linear-gradient(110deg,#192235,#151a28);border-radius:16px;margin:10px 0;padding:13px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.matchinfo{display:grid;gap:7px}.matchline{display:flex;gap:8px;flex-wrap:wrap;color:#d8e1f4;font-size:14px}.chip{background:#26354e;border-radius:8px;padding:5px 8px;font-size:12px}.num{font-weight:800;font-size:21px;padding:0 8px}.empty{padding:20px;text-align:center;color:var(--muted)}.hide{display:none!important}.foot{text-align:center;color:var(--muted);font-size:12px;margin:20px 0}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.toolbar h2{margin:0}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:5}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#171d2c;border:1px solid #394560;border-radius:22px;padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid .wide{grid-column:1/-1}.actions{display:flex;gap:10px;margin-top:15px}.actions>*{flex:1}@media(max-width:430px){.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}}
</style></head><body><main><div class="hero"><h1 id="headerTitle">🥋 FightList</h1><p id="headerSub">Gestor personal de competiciones</p></div><section class="panel"><span class="label">COMPETICIÓN</span><div class="row"><select id="competitionSelect" class="select"></select><button class="btn small" id="newComp">＋ Nueva</button></div><div class="row" style="margin-top:10px"><button class="btn secondary small" id="editComp">Editar competición</button><button class="btn red small" id="deleteComp">Eliminar competición</button></div></section><section class="panel"><span class="label">CABECERA PERSONALIZABLE</span><div class="row"><input id="headerEditTitle" placeholder="Título"><input id="headerEditSub" placeholder="Subtítulo"></div><div class="row" style="margin-top:10px"><button class="btn secondary" id="saveHeader">Guardar cabecera</button></div></section><section class="panel"><div class="toolbar"><h2>Enfrentamientos</h2><button class="btn" id="addMatch">＋ Añadir</button></div><div id="matches"></div><div id="noMatches" class="empty">Aún no hay enfrentamientos. Añade el primero.</div></section><div class="foot">Guardado automático en este navegador · Varias competiciones</div></main><div id="modal" class="modal hide"><div class="modalbox"><h2 id="modalTitle">Añadir</h2><div id="modalContent"></div><div class="actions"><button class="btn secondary" id="cancel">Cancelar</button><button class="btn" id="save">Guardar</button></div></div></div>
<script>
const KEY='fightlist_competitions_v1',HEAD='fightlist_header_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};data=data||[{id:crypto.randomUUID(),name:'Mi competición',date:'',venue:'',matches:[]}];let active=data[0].id,editing=null,mode='';const $=s=>document.querySelector(s);function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}function current(){return data.find(c=>c.id===active)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let c=current();$('#competitionSelect').innerHTML=data.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#competitionSelect').value=active;$('#matches').innerHTML='';$('#noMatches').classList.toggle('hide',c.matches.length>0);c.matches.forEach((m,i)=>{let el=document.createElement('div');el.className='match';el.innerHTML=`<div class="matchinfo"><div class="matchline"><span class="chip">🕒 ${esc(m.time||'—')}</span><span class="chip">🥋 Tapiz ${esc(m.mat||'—')}</span></div><strong>${esc(m.name||'Competidor')}</strong><div class="matchline">${esc(m.category||'Sin categoría')}</div></div><div class="row" style="flex:none"><span class="num">#${esc(m.number||'—')}</span><button class="btn secondary small" data-edit="${i}">Editar</button><button class="btn red small" data-del="${i}">✕</button></div>`;$('#matches').append(el)});$('#matches').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{c.matches.splice(+b.dataset.del,1);persist()});$('#matches').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openMatch(+b.dataset.edit));let h=JSON.parse(localStorage.getItem(HEAD)||'{"title":"🥋 FightList","sub":"Gestor personal de competiciones"}');$('#headerTitle').textContent=h.title;$('#headerSub').textContent=h.sub;$('#headerEditTitle').value=h.title;$('#headerEditSub').value=h.sub}
function showModal(title,content){$('#modalTitle').textContent=title;$('#modalContent').innerHTML=content;$('#modal').classList.remove('hide')}function close(){$('#modal').classList.add('hide');editing=null}
function openMatch(i=null){let m=i===null?{time:'',mat:'',name:'',category:'',number:''}:current().matches[i];editing=i;mode='match';showModal(i===null?'Nuevo enfrentamiento':'Editar enfrentamiento',`<div class="formgrid"><div><label class="label">Hora</label><input id="fTime" type="time" value="${esc(m.time)}"></div><div><label class="label">Tapiz</label><input id="fMat" placeholder="1" value="${esc(m.mat)}"></div><div class="wide"><label class="label">Nombre del competidor</label><input id="fName" value="${esc(m.name)}"></div><div class="wide"><label class="label">Categoría</label><input id="fCategory" value="${esc(m.category)}"></div><div><label class="label">Número de enfrentamiento</label><input id="fNumber" type="number" value="${esc(m.number)}"></div></div>`)}function openCompetition(edit=false){let c=edit?current():{name:'',date:'',venue:''};mode='comp';editing=edit?active:null;showModal(edit?'Editar competición':'Nueva competición',`<div class="formgrid"><div class="wide"><label class="label">Nombre</label><input id="cName" value="${esc(c.name)}"></div><div><label class="label">Fecha</label><input id="cDate" type="date" value="${esc(c.date||'')}"></div><div><label class="label">Lugar</label><input id="cVenue" value="${esc(c.venue||'')}"></div></div>`)}
$('#addMatch').onclick=()=>openMatch();$('#newComp').onclick=()=>openCompetition();$('#editComp').onclick=()=>openCompetition(true);$('#deleteComp').onclick=()=>{if(data.length===1){alert('Debe quedar al menos una competición.');return}if(confirm('¿Eliminar esta competición y sus enfrentamientos?')){data=data.filter(x=>x.id!==active);active=data[0].id;persist()}};$('#competitionSelect').onchange=e=>{active=e.target.value;render()};$('#saveHeader').onclick=()=>{localStorage.setItem(HEAD,JSON.stringify({title:$('#headerEditTitle').value||'🥋 FightList',sub:$('#headerEditSub').value||''}));render()};$('#cancel').onclick=close;$('#save').onclick=()=>{if(mode==='match'){let m={time:$('#fTime').value,mat:$('#fMat').value,name:$('#fName').value.trim(),category:$('#fCategory').value.trim(),number:$('#fNumber').value};if(!m.name){alert('Introduce el nombre del competidor.');return}if(editing===null)current().matches.push(m);else current().matches[editing]=m}else{let c={name:$('#cName').value.trim(),date:$('#cDate').value,venue:$('#cVenue').value};if(!c.name){alert('Introduce el nombre de la competición.');return}if(editing)Object.assign(current(),c);else{let n={id:crypto.randomUUID(),...c,matches:[]};data.push(n);active=n.id}}close();persist()};render();
</script></body></html>
